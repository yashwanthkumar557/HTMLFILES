
<!DOCTYPE html>
<html>
<head>
    <title>HTML Frames Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            border: 3px solid rgb(242, 235, 235);
            padding: 15px;
            font-size: 28px;
            font-weight: bold;
            font-family: Georgia;
        }

        .top {
            background-color: #f57309;
            height: 50px;
        }

        .main {
            background-color: #B5DDB5;
            height: 120px;
            vertical-align: top;
        }

        .bottom {
            background-color: #0bef35;
            height: 30px;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="top">Top Frame</td>
        </tr>

        <tr>
            <td class="main">Main Frame</td>
        </tr>

        <tr>
            <td class="bottom">Bottom Frame</td>
        </tr>
    </table>

</body>
</html>
